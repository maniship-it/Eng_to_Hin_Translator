[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anuvad"
version = "1.0.0"
description = "Anuvad Plus — offline English to Hindi translator and dictionary"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "ctranslate2>=4.4,<5",
    "sentencepiece>=0.2,<0.3",
]

[project.scripts]
anuvad = "anuvad.__main__:main"

[project.gui-scripts]
anuvad-gui = "anuvad.gui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "integration: tests that load a real CTranslate2 model",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # Tk widgets finalised after the interpreter tears down the event loop.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
